[project]
name = "agent-quality"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "itsorivera", email = "its.orivera@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk[http-server]==1.1.2",
    "aiohttp>=3.10.0",
    "fastapi>=0.115.0",
    "google-adk>=2.7.1",
    "httpx>=0.28.1",
    "langgraph>=1.2.11",
    "openai>=1.40.0",
    "python-dotenv>=1.0.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
agent-quality = "agent_quality:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
